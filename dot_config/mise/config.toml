# Same CLI tools and versions on Debian and macOS, newer than apt carries.
# Change a version or add a tool, then `chezmoi apply` (or `mise install`).
[tools]
bat = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
terraform = "1.17.1"
uv = "latest"
ansible = { version = "latest", python = "3.13", with = ["proxmoxer", "requests", "jmespath"] }
"pypi:ansible-lint" = "latest"

# Language runtimes, when you need them:
# node = "lts"
# python = "3.13"
# go = "latest"

[settings]
experimental = false
